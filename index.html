  // =========================================================================
  // Owned plays
  // =========================================================================
  // Each signed-in person can own up to five plays a calendar month for free.
  // Owning a play gives you the next edition number for it: the first owner
  // holds #1, the second #2, and so on. Two records are written together:
  //   plays/<play>/editions/<n>       who holds edition n of that play
  //   users/<you>/plays/<month>_<1-5> one of your five slots for the month
  // The database's rules only accept them as a pair, only accept edition n if
  // n-1 exists, and only accept slots 1 to 5 for the current month. That is
  // what makes the numbers and the limit real rather than something this
  // page merely promises.
  //
  // An edition can change hands on the market (further down). Who holds it is
  // always whatever its edition record says, so every list of "plays I own"
  // is checked against those records before it is shown.
  var PLAYS_PER_MONTH = 5;
  var DAILY_COINS = 10;        // these three have to match the database's rules
  var EXTRA_PLAY_COST = 50;
  var PRICE_MAX = 100000;
  var mySlots = null;      // every slot I have filled; null until loaded
  var myPlays = null;      // the plays I hold right now; null until loaded
  var myListings = {};     // listing name -> listing, for plays I have up for sale
  var mineAt = 0;          // when the three things above were last fetched
  var claiming = {};       // play key -> true while saving
  var claimNote = {};      // play key -> message to show on that play
  function monthId(){ var d = new Date(); return d.getUTCFullYear() + "-" + (d.getUTCMonth() + 1); }   // matches the month the rules compute
  function playKey(league, gameId, playId){
    var g = String(gameId == null ? "" : gameId).replace(/[^A-Za-z0-9]/g, ""), p = String(playId == null ? "" : playId).replace(/[^A-Za-z0-9]/g, "");
    return (g && p && g.length <= 24 && p.length <= 40) ? league + "_" + g + "_" + p : "";
  }
  function lid(p){ return p.key + "_" + p.edition; }      // one edition of one play; also the name of its listing
  function coinWord(n){ return n + (n === 1 ? " coin" : " coins"); }
  function ownedPlay(key){ return (myPlays || []).filter(function(p){ return p.key === key; })[0] || null; }
  function slotsThisMonth(pattern){ var m = monthId(); return (mySlots || []).filter(function(p){ return p.month === m && pattern.test(String(p.slot)); }); }
  function freeUsed(){ return slotsThisMonth(/_[1-5]$/).length; }
  function extraUsed(){ return slotsThisMonth(/_b[0-9]+$/).length; }
  function stamp(p){ return (p.at && typeof p.at.seconds === "number") ? p.at.seconds : 0; }
  function records(snap, bought){
    return snap.docs.map(function(d){ var x = d.data() || {}; if (bought) x.bought = true; else x.slot = d.id; return x; })
      .filter(function(x){ return x && typeof x.key === "string" && typeof x.edition === "number"; });
  }
  // Everything one person holds: the plays they claimed plus the ones they
  // bought, minus any that have since been sold to someone else.
  function holdings(uid){
    var F = fb.F;
    return Promise.all([
      F.getDocs(F.collection(fb.db, "users", uid, "plays")).then(function(s){ return records(s, false); }),
      F.getDocs(F.collection(fb.db, "users", uid, "bought")).then(function(s){ return records(s, true); }).catch(function(){ return []; })
    ]).then(function(r){
      var seen = {};
      var all = r[0].concat(r[1]).filter(function(p){ var id = lid(p); if (seen[id]) return false; seen[id] = true; return true; })
        .sort(function(a, b){ return (stamp(b) - stamp(a)) || String(b.slot || "").localeCompare(String(a.slot || ""), undefined, {numeric: true}); });
      return Promise.all(all.map(function(p){
        return F.getDoc(F.doc(fb.db, "plays", p.key, "editions", String(p.edition)))
          .then(function(s){ return !s.exists() || s.data().uid === uid; }, function(){ return true; });
      })).then(function(held){
        return {slots: r[0], plays: all.filter(function(p, i){ return held[i]; })};
      });
    });
  }
  function forgetMine(){
    mySlots = null; myPlays = null; myListings = {}; mineAt = 0;
    wallet = null; walletErr = ""; gotDaily = false;
    claimNote = {}; selling = null; sellNote = {}; lotNote = {}; armed = ""; marketFlash = "";
  }
  function loadMyPlays(user){
    var uid = user.uid, F = fb.F;
    mineAt = Date.now();
    holdings(uid).then(function(h){ if (me && me.uid === uid){ mySlots = h.slots; myPlays = h.plays; } },
                       function(){ if (me && me.uid === uid){ mySlots = mySlots || []; myPlays = myPlays || []; } })
      .then(repaintSocial);
    F.getDocs(F.query(F.collection(fb.db, "market"), F.where("seller", "==", uid))).then(function(snap){
      if (!me || me.uid !== uid) return;
      myListings = {};
      snap.docs.forEach(function(d){ myListings[d.id] = d.data(); });
      repaintSocial();
    }).catch(function(){});
    openWallet(user);
  }
  // Called when a screen that shows my plays or coins opens: fetch again if what we have is getting old.
  function refreshMine(){
    if (fb && me && !signingUp && Date.now() - mineAt > 15000) loadMyPlays(me);
  }
  function claimPlay(key, rec){
    if (!key || claiming[key]) return;
    if (!fb || !me){ claimNote[key] = "Sign in on the Profile tab to own plays."; return repaintSocial(); }
    if (mySlots === null || myPlays === null){ claimNote[key] = "One moment, still loading your plays."; return repaintSocial(); }
    if (ownedPlay(key)) return;
    var month = monthId(), uid = me.uid, F = fb.F;
    var taken = mySlots.filter(function(p){ return p.month === month; }).map(function(p){ return p.slot; });
    var free = [1, 2, 3, 4, 5].filter(function(n){ return taken.indexOf(month + "_" + n) < 0; })[0];
    var slot = free ? month + "_" + free : "", left = 0;
    if (!free){
      // The five free ones are used: an extra play costs coins.
      if (!wallet){ claimNote[key] = "One moment, still loading your coins."; return repaintSocial(); }
      if (wallet.coins < EXTRA_PLAY_COST){
        claimNote[key] = "You've used your " + PLAYS_PER_MONTH + " free plays this month. Another costs " + coinWord(EXTRA_PLAY_COST) + " and you have " + wallet.coins + ".";
        return repaintSocial();
      }
      var k = 1;
      while (k < 100 && taken.indexOf(month + "_b" + k) >= 0) k++;
      if (k > 99){ claimNote[key] = "That's the most plays one person can own in a month."; return repaintSocial(); }
      slot = month + "_b" + k;
    }
    claiming[key] = true; delete claimNote[key];
    repaintSocial();
    function attempt(triesLeft){
      // The highest edition so far; ours is the next one.
      return F.getDocs(F.query(F.collection(fb.db, "plays", key, "editions"), F.orderBy("n", "desc"), F.limit(1))).then(function(top){
        var n = (top.docs.length ? Number(top.docs[0].data().n) || 0 : 0) + 1;
        var mine = {key: key, edition: n, editionId: String(n), month: month, league: rec.league, game: rec.game, text: rec.text, when: rec.when,
                    title: rec.title, date: rec.date, score: rec.score, at: F.serverTimestamp()};
        var edition = {uid: uid, n: n, prev: n > 1 ? String(n - 1) : "", slot: slot, at: F.serverTimestamp()};
        var edRef = F.doc(fb.db, "plays", key, "editions", String(n)), slotRef = F.doc(fb.db, "users", uid, "plays", slot);
        if (free){
          var batch = F.writeBatch(fb.db);
          batch.set(edRef, edition);
          batch.set(slotRef, mine);
          return batch.commit().then(function(){ mine.slot = slot; return mine; });
        }
        // Paid: the coins leave the wallet in the same step, or nothing happens at all.
        var wRef = F.doc(fb.db, "wallets", uid);
        return F.runTransaction(fb.db, function(tx){
          return tx.get(wRef).then(function(w){
            if (!w.exists() || !(w.data().coins >= EXTRA_PLAY_COST)) throw coded("You don't have " + coinWord(EXTRA_PLAY_COST) + " for another play.");
            left = w.data().coins - EXTRA_PLAY_COST;
            tx.set(edRef, edition);
            tx.set(slotRef, mine);
            tx.update(wRef, {coins: left, ref: slot});
          });
        }).then(function(){ mine.slot = slot; return mine; });
      }).catch(function(err){
        // Refused usually means someone else took that number a moment before us: look again and take the next.
        if (triesLeft > 0 && err && err.code === "permission-denied") return attempt(triesLeft - 1);
        throw err;
      });
    }
    attempt(3).then(function(mine){
      if (!me || me.uid !== uid) return;
      mySlots = [mine].concat(mySlots || []);
      myPlays = [mine].concat(myPlays || []);
      if (!free && wallet){ wallet.coins = left; wallet.ref = slot; }
    }).catch(function(err){
      claimNote[key] = (err && err.friendly) ? err.friendly : "Couldn't save that play" + (err && err.code ? " (" + err.code + ")" : "") + ". Try again.";
    }).then(function(){
      delete claiming[key];
      repaintSocial();
      if (ownedPlay(key)) replay(document.querySelector('[data-owned="' + key + '"]'), "pop");
    });
  }
  function ownHtml(p, g){
    var key = p.ownable ? playKey(g.league, g.id, p.id) : "";
    if (!key) return "";
    var mine = ownedPlay(key);
    if (mine) return '<div class="own"><span class="own-badge" data-owned="' + key + '">Yours, edition #' + mine.edition + '</span></div>';
    var paid = !!me && mySlots !== null && freeUsed() >= PLAYS_PER_MONTH;
    return '<div class="own"><button type="button" class="own-btn" data-own="' + esc(p.id) + '"' + (claiming[key] ? ' disabled' : '') + '>' +
      (claiming[key] ? 'Saving…' : paid ? 'Own for ' + coinWord(EXTRA_PLAY_COST) : 'Own this play') + '</button>' +
      (claimNote[key] ? '<div class="own-note">' + esc(claimNote[key]) + '</div>' : '') + '</div>';
  }
  function quotaLine(){
    if (!me) return '<div class="live-note">Sign in on the Profile tab to own plays. You get ' + PLAYS_PER_MONTH + ' a month.</div>';
    if (mySlots === null) return "";
    var used = freeUsed(), extra = extraUsed();
    return '<div class="live-note">Plays owned this month: ' + used + ' of ' + PLAYS_PER_MONTH +
      (extra ? ', plus ' + extra + ' bought with coins' : '') +
      (used >= PLAYS_PER_MONTH ? '. Another costs ' + coinWord(EXTRA_PLAY_COST) + (wallet ? '; you have ' + wallet.coins : '') + '.' : '') + '</div>';
  }
  function playDay(date){
    var d = new Date(date);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
  }
  function playHref(p){ return LEAGUES[p.league] && p.game ? '#game/' + p.league + '/' + encodeURIComponent(p.game) : '#'; }
  // mine = true adds the Sell controls under each play (your own Profile only).
  function ownedList(list, mine){
    return '<div class="owned-list">' + list.map(function(p){
      var meta = [clean(p.title || ""), playDay(p.date), clean(p.when || "")].filter(Boolean).join(", ");
      var card = '<a class="owned" href="' + playHref(p) + '">' +
        '<span class="ed">#' + esc(p.edition) + '</span>' +
        '<span class="owned-text">' + esc(clean(String(p.text || "").slice(0, 400), null, true)) + '</span>' +
        (p.score ? '<span class="owned-score">' + esc(clean(p.score)) + '</span>' : '') +
        '<span class="owned-meta">' + esc(meta) + '</span></a>';
      return mine ? '<div class="owned-item">' + card + '<div class="owned-act">' + sellControls(p) + '</div></div>' : card;
    }).join("") + '</div>';
  }

  // =========================================================================
  // Coins and the market
  // =========================================================================
  // Coins are earned, never bought: ten arrive on each day you open the app
  // signed in. They do two things. Fifty buy an extra play once the month's
  // five free ones are used, and any number can buy a play someone has put up
  // for sale. Records:
  //   wallets/<you>                {coins, y, m, d, ref, sold}
  //   market/<play>_<n>            one edition offered at a price
  //   users/<you>/bought/<play>_<n> a note that you bought it, so your profile can find it
  // A purchase changes the edition's holder, takes the price from the buyer,
  // gives it to the seller and removes the listing, all in one step. The
  // database's rules refuse that step unless every part of it is there, and
  // refuse any other change to a balance.
  var wallet = null;       // null until loaded
  var walletErr = "";      // why it could not be loaded, if it couldn't
  var walletBusy = false;
  var gotDaily = false;    // this visit is the one that added today's coins
  function utcDay(){ var d = new Date(); return {y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate()}; }   // the rules count days the same way
  function nextDaily(){
    var t = utcDay();
    return new Date(Date.UTC(t.y, t.m - 1, t.d + 1)).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
  }
  // Loads the balance, and adds the day's coins if they haven't been added yet.
  function openWallet(user){
    if (!fb || !user || walletBusy) return;
    walletBusy = true;
    var F = fb.F, uid = user.uid, ref = F.doc(fb.db, "wallets", uid), t = utcDay(), added = false, why = "";
    F.runTransaction(fb.db, function(tx){
      return tx.get(ref).then(function(snap){
        added = false;
        if (!snap.exists()){
          var fresh = {coins: DAILY_COINS, y: t.y, m: t.m, d: t.d, ref: "", sold: ""};
          tx.set(ref, fresh);
          added = true;
          return fresh;
        }
        var w = snap.data();
        if (w.y === t.y && w.m === t.m && w.d === t.d) return w;
        tx.update(ref, {coins: w.coins + DAILY_COINS, y: t.y, m: t.m, d: t.d});
        added = true;
        return {coins: w.coins + DAILY_COINS, y: t.y, m: t.m, d: t.d, ref: w.ref, sold: w.sold};
      });
    }).catch(function(err){
      // Refused (this device's clock may be a day out) or offline: just show the balance.
      added = false; why = (err && err.code) || "error";
      return F.getDoc(ref).then(function(s){ return s.exists() ? s.data() : null; }, function(e){ why = (e && e.code) || why; return null; });
    }).then(function(w){
      walletBusy = false;
      if (!me || me.uid !== uid) return;
      if (w && typeof w.coins === "number"){ wallet = w; walletErr = ""; if (added) gotDaily = true; }
      else if (!wallet) walletErr = why || "not found";
      repaintSocial();
    });
  }

  // ---- Selling: the controls under each play on your own Profile ----
  var selling = null;      // {id, price} while the price box is open
  var sellBusy = {}, sellNote = {};
  function sellControls(p){
    var id = lid(p), listed = myListings[id];
    var note = sellNote[id] ? '<div class="own-note">' + esc(sellNote[id]) + '</div>' : '';
    if (sellBusy[id]) return '<span class="owned-meta">One moment…</span>';
    if (listed) return '<span class="price">For sale, ' + coinWord(listed.price) + '</span>' +
      '<button type="button" class="mini" data-unlist="' + esc(id) + '">Take down</button>' + note;
    if (selling && selling.id === id) return '<form class="sell-form" data-sellform="' + esc(id) + '" novalidate>' +
      '<input id="sellPrice" class="price-in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Price in coins" aria-label="Price in coins" value="' + esc(selling.price) + '">' +
      '<button type="submit" class="mini solid">List it</button>' +
      '<button type="button" class="mini" data-sellcancel>Never mind</button></form>' + note;
    return '<button type="button" class="mini" data-sell="' + esc(id) + '">Sell</button>' + note;
  }
  function paintSell(){ paintProfile(); var box = $("sellPrice"); if (box) box.focus(); }
  function listPlay(id, raw){
    var p = (myPlays || []).filter(function(x){ return lid(x) === id; })[0];
    if (!p || !fb || !me || sellBusy[id]) return;
    var typed = String(raw == null ? "" : raw).trim();
    var price = /^[0-9]{1,6}$/.test(typed) ? Number(typed) : 0;
    if (price < 1 || price > PRICE_MAX){ sellNote[id] = "Type a whole number of coins, from 1 to 100,000."; return paintSell(); }
    if (!wallet){ sellNote[id] = "One moment, still loading your coins."; return paintSell(); }
    var F = fb.F, uid = me.uid;
    var rec = {key: p.key, n: p.edition, nid: String(p.edition), seller: uid, sellerName: displayName(me).slice(0, 20), price: price,
               text: String(p.text || "").slice(0, 400), when: p.when || "", title: String(p.title || "").slice(0, 60),
               league: p.league || "", game: p.game || "", date: p.date || "", score: p.score || "", at: F.serverTimestamp()};
    sellBusy[id] = true; delete sellNote[id];
    paintProfile();
    F.setDoc(F.doc(fb.db, "market", id), rec).then(function(){
      if (me && me.uid === uid){ myListings[id] = rec; selling = null; }
    }, function(err){
      sellNote[id] = (err && err.code === "permission-denied")
        ? "The market wouldn't take that (permission-denied). You may no longer hold this play."
        : "Couldn't list that" + (err && err.code ? " (" + err.code + ")" : "") + ". Try again.";
    }).then(function(){ delete sellBusy[id]; repaintSocial(); });
  }
  function unlist(id){
    if (!fb || !me || sellBusy[id] || lotBusy[id]) return;
    var uid = me.uid;
    sellBusy[id] = lotBusy[id] = true; delete sellNote[id]; delete lotNote[id];
    repaintSocial();
    fb.F.deleteDoc(fb.F.doc(fb.db, "market", id)).then(function(){
      if (me && me.uid === uid) delete myListings[id];
      market.list = market.list.filter(function(x){ return x.id !== id; });
    }, function(err){
      sellNote[id] = lotNote[id] = "Couldn't take that down" + (err && err.code ? " (" + err.code + ")" : "") + ". It may have just sold.";
      mineAt = 0;
    }).then(function(){ delete sellBusy[id]; delete lotBusy[id]; repaintSocial(); refreshMine(); });
  }
  $("profExtras").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.sell){ selling = {id: b.dataset.sell, price: ""}; sellNote = {}; return paintSell(); }
    if (b.hasAttribute("data-sellcancel")){ selling = null; return paintProfile(); }
    if (b.dataset.unlist) unlist(b.dataset.unlist);
  });
  $("profExtras").addEventListener("input", function(e){
    if (e.target.id === "sellPrice" && selling) selling.price = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
  });
  $("profExtras").addEventListener("submit", function(e){
    var form = e.target.closest("form[data-sellform]");
    if (!form) return;
    e.preventDefault();
    listPlay(form.dataset.sellform, $("sellPrice") ? $("sellPrice").value : "");
  });

  // ---- The Market screen ----
  var market = {state: "idle", list: [], code: ""};   // state: idle | loading | ready | failed
  var lotBusy = {}, lotNote = {};
  var armed = "";          // the listing whose Buy button has been tapped once
  var marketFlash = "";    // one line of news above the listings
  function validLot(x){
    return x && typeof x.key === "string" && typeof x.seller === "string" && typeof x.nid === "string" &&
      typeof x.n === "number" && typeof x.price === "number" && x.price >= 1;
  }
  function loadMarket(){
    if (accountsState === "failed"){ market.state = "failed"; market.code = ""; return paintMarket(); }
    if (market.state !== "ready") market.state = "loading";
    paintMarket();
    if (!fb) return;                                  // startAccounts() calls back in once the service is ready
    var F = fb.F;
    F.getDocs(F.query(F.collection(fb.db, "market"), F.orderBy("at", "desc"), F.limit(60))).then(function(snap){
      market.list = snap.docs.map(function(d){ var x = d.data() || {}; x.id = d.id; return x; }).filter(validLot);
      market.state = "ready"; market.code = "";
    }, function(err){
      if (market.state !== "ready"){ market.state = "failed"; market.code = (err && err.code) || ""; }
    }).then(function(){ if (view === "market") paintMarket(); });
  }
  function buyLot(id){
    var lot = market.list.filter(function(x){ return x.id === id; })[0];
    if (!lot || lotBusy[id]) return;
    if (!fb || !me){ lotNote[id] = "Sign in on the Profile tab to buy plays."; return paintMarket(); }
    if (!wallet){ lotNote[id] = "One moment, still loading your coins."; return paintMarket(); }
    if (wallet.coins < lot.price){
      armed = "";
      lotNote[id] = "That costs " + coinWord(lot.price) + " and you have " + wallet.coins + ".";
      return paintMarket();
    }
    if (armed !== id){ armed = id; lotNote = {}; return paintMarket(); }     // first tap only asks; the second one pays
    armed = ""; lotBusy[id] = true; delete lotNote[id]; marketFlash = "";
    paintMarket();
    var F = fb.F, uid = me.uid, left = 0, got = null;
    var lotRef = F.doc(fb.db, "market", id), myRef = F.doc(fb.db, "wallets", uid);
    F.runTransaction(fb.db, function(tx){
      var L, edRef, theirRef;
      return tx.get(lotRef).then(function(s){
        if (!s.exists()) throw gone("Someone else just bought that one.");
        L = s.data();
        if (L.seller === uid) throw coded("That one is already yours.");
        edRef = F.doc(fb.db, "plays", L.key, "editions", L.nid);
        theirRef = F.doc(fb.db, "wallets", L.seller);
        return Promise.all([tx.get(edRef), tx.get(myRef), tx.get(theirRef)]);
      }).then(function(r){
        var ed = r[0], mine = r[1], theirs = r[2];
        if (!ed.exists() || ed.data().uid !== L.seller || !theirs.exists()) throw gone("That listing was out of date, so it has been skipped.");
        if (!mine.exists() || !(mine.data().coins >= L.price)) throw coded("You don't have enough coins for that.");
        left = mine.data().coins - L.price;
        got = {key: L.key, edition: L.n, editionId: L.nid, league: L.league || "", game: L.game || "", text: L.text || "", when: L.when || "",
               title: L.title || "", date: L.date || "", score: L.score || "", at: F.serverTimestamp()};
        tx.update(edRef, {uid: uid});                                             // the play is mine
        tx.update(myRef, {coins: left, ref: id});                                 // I pay
        tx.update(theirRef, {coins: theirs.data().coins + L.price, sold: id});    // they are paid
        tx.delete(lotRef);                                                        // the listing comes down
        tx.set(F.doc(fb.db, "users", uid, "bought", id), got);                    // so my profile can find it
      });
    }).then(function(){
      market.list = market.list.filter(function(x){ return x.id !== id; });
      marketFlash = "Bought. Edition #" + got.edition + " is on your Profile now.";
      if (!me || me.uid !== uid) return;
      if (wallet){ wallet.coins = left; wallet.ref = id; }
      got.bought = true;
      myPlays = [got].concat((myPlays || []).filter(function(p){ return lid(p) !== id; }));
    }, function(err){
      if (err && err.gone){
        market.list = market.list.filter(function(x){ return x.id !== id; });
        marketFlash = err.friendly;
      } else {
        lotNote[id] = (err && err.friendly) ? err.friendly : "Couldn't buy that" + (err && err.code ? " (" + err.code + ")" : "") + ". Try again.";
      }
    }).then(function(){
      delete lotBusy[id];
      repaintSocial();
      if (view === "market" && got && wallet && wallet.ref === id) replay($("coinsBig"), "pop");
    });
  }
  function gone(message){ var e = coded(message); e.gone = true; return e; }
  function walletCard(){
    if (!me){
      if (accountsState === "failed") return '<div class="card"><p class="note first">Couldn\'t reach the account service, so coins are off for now. Scores still work.</p></div>';
      if (accountsState !== "ready") return '<div class="card"><p class="note first">Connecting…</p></div>';
      return '<div class="card"><div class="coins-word">Coins</div>' +
        '<p class="note">Sign in on the Profile tab and you get ' + DAILY_COINS + ' coins on each day you open rad sports. Coins buy plays other people are selling, or an extra play once your ' + PLAYS_PER_MONTH + ' free ones for the month are used.</p></div>';
    }
    if (!wallet) return '<div class="card"><p class="note first">' + (walletErr ? "Couldn't load your coins (" + esc(walletErr) + ")." : "Loading your coins…") + '</p></div>';
    return '<div class="card"><div class="coins-big" id="coinsBig">' + esc(wallet.coins) + '</div>' +
      '<div class="coins-word">' + (wallet.coins === 1 ? 'coin' : 'coins') + '</div>' +
      '<p class="note">' + (gotDaily ? '+' + DAILY_COINS + ' for today.' : "Today's " + DAILY_COINS + ' are already in.') +
      ' Open rad sports after ' + esc(nextDaily()) + ' for the next ' + DAILY_COINS + '.</p>' +
      '<p class="note">Once your ' + PLAYS_PER_MONTH + ' free plays for the month are used, another costs ' + coinWord(EXTRA_PLAY_COST) + '.</p></div>';
  }
  function lotHtml(x){
    var mine = !!me && x.seller === me.uid;
    var meta = [clean(x.title || ""), playDay(x.date), clean(x.when || "")].filter(Boolean).join(", ");
    var seller = clean(String(x.sellerName || ""), "[hidden]");
    var by = /^[A-Za-z0-9_]{3,20}$/.test(seller) ? '<a href="#u/' + seller.toLowerCase() + '">' + esc(seller) + '</a>' : esc(seller || "someone");
    var act;
    if (lotBusy[x.id]) act = '<span class="owned-meta">One moment…</span>';
    else if (mine) act = '<span class="price">' + coinWord(x.price) + '</span><button type="button" class="mini" data-unlist="' + esc(x.id) + '">Take down</button>';
    else act = '<span class="price">' + coinWord(x.price) + '</span><button type="button" class="mini solid" data-buy="' + esc(x.id) + '">' +
      (armed === x.id ? 'Tap again to pay ' + coinWord(x.price) : 'Buy') + '</button>';
    return '<div class="lot">' +
      '<span class="ed">#' + esc(x.n) + '</span>' +
      '<a class="owned-text" href="' + playHref(x) + '">' + esc(clean(String(x.text || "").slice(0, 400), null, true)) + '</a>' +
      (x.score ? '<span class="owned-score">' + esc(clean(x.score)) + '</span>' : '') +
      '<span class="owned-meta">' + esc(meta) + '</span>' +
      '<span class="owned-meta">' + (mine ? 'Your listing' : 'Sold by ' + by) + '</span>' +
      '<div class="lot-act">' + act + '</div>' +
      (lotNote[x.id] ? '<div class="own-note">' + esc(lotNote[x.id]) + '</div>' : '') + '</div>';
  }
  function paintMarket(){
    var html = walletCard() + '<h3 class="sec">For sale</h3>';
    if (marketFlash) html += '<p class="info" role="status">' + esc(marketFlash) + '</p>';
    if (market.state === "failed") html += '<p class="note">Couldn\'t load the market' + (market.code ? ' (' + esc(market.code) + ')' : '') +
      (market.code === "permission-denied" ? '. The database turned the request down.' : '. Check your connection and try again.') + '</p>';
    else if (market.state !== "ready") html += '<p class="note">Loading the market…</p>';
    else if (!market.list.length) html += '<p class="note">Nothing is for sale right now. To sell one of yours, go to Profile and tap Sell under a play.</p>';
    else html += '<div class="owned-list">' + market.list.map(lotHtml).join("") + '</div>';
    $("marketBody").innerHTML = html;
  }
  $("marketBody").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.buy) buyLot(b.dataset.buy);
    else if (b.dataset.unlist) unlist(b.dataset.unlist);
  });
  // Every listing this account has up, as database references (used when the account is deleted).
  function myListingRefs(uid){
    var F = fb.F;
    return F.getDocs(F.query(F.collection(fb.db, "market"), F.where("seller", "==", uid)))
      .then(function(snap){ return snap.docs.slice(0, 400).map(function(d){ return F.doc(fb.db, "market", d.id); }); }, function(){ return []; });
  }

  // What shows under the account card on your own Profile screen.
  function profileExtras(){
    var html = "";
    if (me){
      html += '<h3 class="sec">Coins</h3>' +
        '<a class="coin-row" href="#market"><span class="coin-n">' + (wallet ? esc(wallet.coins) : walletErr ? '?' : '…') + '</span>' +
        '<span class="owned-meta">' + DAILY_COINS + ' more on each day you open rad sports. Tap for the market.</span></a>';
      html += '<h3 class="sec">My plays' + (mySlots ? ', ' + freeUsed() + ' of ' + PLAYS_PER_MONTH + ' free ones used this month' : '') + '</h3>';
      if (myPlays === null) html += '<p class="note">Loading your plays…</p>';
      else if (!myPlays.length) html += '<p class="note">Open a game, go to Plays and tap "Own this play". You get ' + PLAYS_PER_MONTH + ' a month, and the first person to own a play holds edition #1.</p>';
      else html += ownedList(myPlays, true);
    }
    html += '<h3 class="sec">Favorite teams</h3>';
    html += favs.length ? favChips(favs, true)
                        : '<p class="note">Open a game and tap the star under a team. Its games then sit at the top of each day.</p>';
    if (!me && favs.length) html += '<p class="note">Saved on this device. Sign in to keep them on your account.</p>';
    if (me) html += '<button type="button" class="btn ghost" id="shareProfile">Copy my profile link</button><p class="info" id="shareInfo" role="status" hidden></p>';
    return html;
  }
  // Redraw whichever screen is showing after favourites, plays or coins change.
  function repaintSocial(){
    if (view === "home") paint();
    else if (view === "game") paintGame();
    else if (view === "market") paintMarket();
    else if (view === "profile"){
      // Don't pull the price box out from under someone typing in it.
      if (document.activeElement && document.activeElement.id === "sellPrice") return;
      paintProfile();
    }
  }

  // ---- Someone else's profile: #u/<username> ----
  var shown = null;   // {name, state: loading|ready|missing|failed, username, plays, favs}
  function openUser(name){
    var lower = String(name || "").toLowerCase();
    shown = {name: lower, state: "loading"};
    paintUser();
    if (!/^[a-z0-9_]{3,20}$/.test(lower)){ shown.state = "missing"; return paintUser(); }
    if (accountsState === "failed"){ shown.state = "failed"; return paintUser(); }
    if (!fb) return;                                  // startAccounts() calls back in once the service is ready
    var who = shown, F = fb.F;
    F.getDoc(F.doc(fb.db, "usernames", lower)).then(function(snap){
      if (!snap.exists()){ who.state = "missing"; return; }
      var uid = snap.data().uid;
      who.username = snap.data().username || lower;
      return Promise.all([
        holdings(uid).then(function(h){ return h.plays; }).catch(function(){ return []; }),
        F.getDoc(F.doc(fb.db, "profiles", uid)).then(function(p){ return (p.exists() && Array.isArray(p.data().favs) ? p.data().favs : []).filter(validFav); }).catch(function(){ return []; })
      ]).then(function(r){ who.plays = r[0]; who.favs = r[1]; who.state = "ready"; });
    }).catch(function(){ who.state = "failed"; })
      .then(function(){ if (shown === who && view === "user") paintUser(); });
  }
  function paintUser(){
    var el = $("userBody"), s = shown;
    if (!s) return;
    if (s.state === "loading"){ el.innerHTML = empty("Loading profile…"); return; }
    if (s.state === "missing"){ el.innerHTML = empty("There's no rad sports profile with that name."); return; }
    if (s.state === "failed"){ el.innerHTML = empty("Couldn't load that profile. Check your connection and try again."); return; }
    var name = clean(s.username, "[hidden]");
    el.innerHTML = '<div class="card"><div class="who"><div class="avatar" aria-hidden="true">' + esc(name === "[hidden]" ? "?" : name.charAt(0).toUpperCase()) + '</div>' +
      '<div style="min-width:0"><div class="who-name">' + esc(name) + '</div>' +
      '<div class="who-since">' + s.plays.length + (s.plays.length === 1 ? ' play owned' : ' plays owned') + '</div></div></div></div>' +
      '<h3 class="sec">Plays</h3>' + (s.plays.length ? ownedList(s.plays, false) : '<p class="note">No plays owned yet.</p>') +
      '<h3 class="sec">Favorite teams</h3>' + (s.favs.length ? favChips(s.favs, false) : '<p class="note">None picked yet.</p>');
  }

  // =========================================================================
  // Bottom bar
  // =========================================================================
  // The address after the # decides the screen, so the phone's back button
  // and the browser's back arrow both work: "" is Home, "#profile" is
  // Profile, "#market" is the Market, "#game/nfl/401..." is one game.
  var homeScroll = 0, hops = 0;
  function setView(v){
    if (view === "home" && v !== "home") homeScroll = window.scrollY;
    if (v !== view) replay($(v === "home" ? "viewHome" : v === "game" ? "viewGame" : v === "user" ? "viewUser" : v === "market" ? "viewMarket" : "viewProfile"), "enter");
    view = v;
    $("viewHome").hidden = v !== "home";
    $("viewGame").hidden = v !== "game";
    $("viewProfile").hidden = v !== "profile";
    $("viewUser").hidden = v !== "user";
    $("viewMarket").hidden = v !== "market";
    $("homeControls").hidden = v !== "home";
    $("gameControls").hidden = true;          // the game screen turns its tabs on once it has a game
    $("gBack").hidden = v !== "game" && v !== "user";
    $("pulse").hidden = v === "profile" || v === "user" || v === "market";
    $("title").textContent = v === "market" ? "Market" : (v === "profile" || v === "user") ? "Profile" : "rad sports";
    $("brandMark").hidden = v !== "home";
    var tab = v === "profile" ? "navProfile" : v === "market" ? "navMarket" : "navHome";
    ["navHome", "navMarket", "navProfile"].forEach(function(id){
      if (id === tab) $(id).setAttribute("aria-current", "page"); else $(id).removeAttribute("aria-current");
    });
    if (v !== "market"){ armed = ""; marketFlash = ""; lotNote = {}; }
    if (v !== "profile"){ selling = null; sellNote = {}; }
  }
  function route(){
    var h = location.hash.replace(/^#/, "");
    var m = /^game\/([a-z]+)\/([^\/]+)$/.exec(h);
    if (m && LEAGUES[m[1]]){
      var id = decodeURIComponent(m[2]);
      setView("game");
      window.scrollTo(0, 0);
      if (game && game.league === m[1] && same(game.id, id)){ game.drawn = {}; paintGame(); loadGame(); }
      else openGame(m[1], id);
    } else if (/^u\/[A-Za-z0-9_%]{1,40}$/.test(h)){
      setView("user");
      window.scrollTo(0, 0);
      var who = h.slice(2);
      try { who = decodeURIComponent(who); } catch(e){}
      openUser(who);
    } else if (h === "profile"){
      setView("profile");
      window.scrollTo(0, 0);
      paintProfile();
      refreshMine();
    } else if (h === "market"){
      setView("market");
      window.scrollTo(0, 0);
      loadMarket();
      if (me && !signingUp) openWallet(me);      // also collects today's coins if they aren't in yet
      refreshMine();
    } else {
      var back = view !== "home";
      setView("home");
      paint();
      load(league);
      if (back) window.scrollTo(0, homeScroll);   // return to the game you tapped, not the top
    }
  }
  window.addEventListener("hashchange", function(){ hops++; route(); });

  // ---- Tap feedback ----
  // Three small things, all of them answers to a tap: the control you
  // pressed gives a little, a soft green ring spreads from your finger, and
  // the screen you asked for eases in. People who have asked their device
  // for less motion get none of it.
  var calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function replay(el, cls){
    if (calm || !el) return;
    el.classList.remove(cls);
    void el.offsetWidth;          // lets the same animation run again
    el.classList.add(cls);
  }
  document.addEventListener("touchstart", function(){}, {passive:true});   // lets :active styles work on iPhones
  document.addEventListener("pointerdown", function(e){
    if (calm || !e.target.closest) return;
    var hit = e.target.closest(".game-link, button, .radio-btn, .owned, .coin-row");
    if (!hit || hit.disabled) return;
    var host = hit.classList.contains("game-link") ? hit.parentNode : hit;
    var r = host.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.2;
    var ink = document.createElement("span");
    ink.className = "ink";
    ink.style.width = ink.style.height = size + "px";
    ink.style.left = (e.clientX - r.left - size / 2) + "px";
    ink.style.top = (e.clientY - r.top - size / 2) + "px";
    host.appendChild(ink);
    // Removed on a timer, not on "animation finished": if the tap opens another
    // screen, this one is hidden and its animation never reports finishing.
    setTimeout(function(){ ink.remove(); }, 600);
  }, {passive:true});
  document.addEventListener("click", function(e){
    var btn = e.target.closest && e.target.closest("#leagues button, #gTabs button, #filters button, #authMode button, .nav button, .seg.side button");
    if (!btn) return;
    // the side switch is redrawn on click, so pop whichever button is pressed afterwards
    replay(btn.closest(".seg.side") ? document.querySelector('.seg.side [aria-pressed="true"]') : btn, "pop");
    if (btn.closest("#leagues, #filters")) replay($("games"), "swap");
    if (btn.closest("#gTabs, .seg.side")) replay($("gBody"), "swap");
  });
  function go(hash){
    if (location.hash.replace(/^#/, "") === hash) route(); else location.hash = hash;
  }
  $("navHome").addEventListener("click", function(){ go(""); });
  $("navMarket").addEventListener("click", function(){ go("market"); });
  $("navProfile").addEventListener("click", function(){ go("profile"); });
  $("gBack").addEventListener("click", function(){
    if (hops > 0) history.back(); else go("");
  });

  setMode("signin");
  startAccounts();  // also fills in the username on the bottom bar once signed in
  route();
})();
</script>
</body>
</html>
