<style>
  /* One typeface throughout: Castoro, which ships in a single weight plus an
     italic. Hierarchy comes from size, colour and the italic, never from bold.
     The page is always dark; kelly green marks what is selected or tappable,
     red is kept for "live" and errors only. */
  :root{
    --bg:#0c0f0d; --backdrop:#070908; --surface:#141815; --surface-raised:#1c221e;
    --ink:#eef2ec; --ink-soft:#c3cac3; --ink-dim:#8a938c;
    --accent:#4cbb17; --accent-ink:#06150a;
    --live:#f0604f; --danger:#f0604f;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
    --warn-bg:#2b230c; --warn-ink:#f0d48a; --field:#090c0a;
    --nav-h:62px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%}
  body{
    background:var(--backdrop); color:var(--ink);
    font-family:'Castoro',Georgia,'Times New Roman',serif; font-weight:400; font-synthesis:none;
    font-variant-numeric:lining-nums; font-size:15px; line-height:1.4; text-align:center;
    display:flex; justify-content:center;
  }
  b, strong, th, h1, h3{font-weight:400}
  [hidden]{display:none !important}
  .frame{
    width:100%; max-width:480px; min-width:0; background:var(--bg); min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  }
  button, input{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---- Header ---- */
  .top{
    position:sticky; top:0; z-index:5; background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:calc(16px + env(safe-area-inset-top, 0px)) 16px 12px;
  }
  .top-row{display:flex; flex-direction:column; align-items:center; gap:5px; position:relative}
  .title-wrap{display:flex; align-items:center; justify-content:center; gap:10px; min-width:0}
  .brand-mark{display:flex; flex:0 0 auto; width:36px; height:36px}
  .brand-mark svg{width:100%; height:100%; display:block}
  .brand-hero{display:flex; flex-direction:column; align-items:center; gap:8px; font-size:22px; margin:2px 0 20px}
  .brand-hero .brand-mark{width:92px; height:92px}
  h1{font-size:27px; line-height:1.1; letter-spacing:-.01em; margin:0}
  .back{position:absolute; left:-6px; top:-2px; border:0; background:transparent; cursor:pointer; padding:6px; display:flex; color:var(--ink); border-radius:999px}
  .pulse{display:flex; align-items:center; gap:7px; font-size:12px; font-style:italic; color:var(--ink-dim); white-space:nowrap}
  .pulse .dot{width:7px; height:7px; border-radius:50%; background:var(--accent)}
  .pulse.stale .dot{background:var(--live)}
  .pulse.idle .dot{background:var(--ink-dim)}
  @media (prefers-reduced-motion:no-preference){
    .pulse:not(.stale):not(.idle) .dot, .status.live .dot{animation:blink 1.6s ease-in-out infinite}
  }
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:.25}}

  /* League switcher and game tabs share one look: the chosen one is solid green. */
  .leagues, .tabs{display:grid; gap:4px; margin-top:12px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:4px}
  .leagues{grid-template-columns:repeat(4,1fr)}
  .tabs{grid-template-columns:repeat(3,1fr)}
  .leagues button, .tabs button{border:0; background:transparent; border-radius:9px; padding:8px 0; cursor:pointer; font-size:15px; color:var(--ink-dim)}
  .leagues button{letter-spacing:.04em}
  .leagues button[aria-pressed="true"], .tabs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

  .sub{font-size:12.5px; font-style:italic; color:var(--ink-dim); margin-top:10px}
  .filters{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:10px}
  .filters button{
    flex:0 0 auto; font-size:13px; color:var(--ink-dim); background:transparent;
    border:1px solid var(--line); padding:5px 13px; border-radius:999px; cursor:pointer;
  }
  .filters button[aria-pressed="true"]{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 60%, transparent)}

  /* ---- Scores ---- */
  .banner{margin:12px 14px 0; padding:10px 12px; border-radius:10px; background:var(--warn-bg); color:var(--warn-ink); font-size:13.5px; line-height:1.45}
  .group-head{padding:18px 16px 7px; font-size:13px; color:var(--ink-dim)}
  .group-head.live{color:var(--live)}
  .list{display:flex; flex-direction:column; gap:10px; padding:0 14px}
  .game{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0}
  .game.is-live{border-color:color-mix(in srgb, var(--live) 45%, var(--line))}
  .game-link{display:block; color:inherit; text-decoration:none; border-radius:8px}
  .status-row{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px 9px; margin-bottom:10px; min-height:18px}
  .status{font-size:12.5px; color:var(--ink-dim); display:flex; align-items:center; gap:6px}
  .status.live{color:var(--live)}
  .status .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
  .meta{font-size:12.5px; font-style:italic; color:var(--ink-dim)}
  .po{
    font-size:11.5px; line-height:1.3; color:var(--accent); white-space:nowrap;
    border:1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius:999px; padding:0 8px 1px;
  }
  /* The matchup: away side, score, home side. Each side is a logo over a name. */
  .bug{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
  .side{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
  .logo{flex:0 0 auto; width:28px; height:28px; object-fit:contain; filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
  .logo.big{width:48px; height:48px}
  .name{font-size:16px; line-height:1.2; overflow-wrap:anywhere; text-wrap:balance}
  .rank{font-size:12px; color:var(--ink-dim); margin-right:5px}
  .mid{display:flex; align-items:baseline; justify-content:center; gap:7px; white-space:nowrap}
  .score{font-size:26px; line-height:1}
  .dash{color:var(--ink-dim); font-size:18px}
  .at{font-size:13.5px; font-style:italic; color:var(--ink-dim); padding:0 6px}
  .name.loser, .score.loser{color:var(--ink-dim)}
  .actions{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:12px}
  .actions:empty{display:none}
  .radio-btn{
    display:inline-flex; align-items:center; gap:8px; font-size:13.5px; text-decoration:none; max-width:100%;
    color:var(--accent); background:color-mix(in srgb, var(--accent) 9%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 55%, transparent); padding:6px 14px 7px; border-radius:999px;
  }
  .radio-btn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .radio-btn svg{flex:0 0 auto}
  .radio-note{font-size:12.5px; font-style:italic; color:var(--ink-dim); border:1px dashed var(--line-strong); padding:5px 12px 6px; border-radius:999px}
  .empty{padding:36px 24px; text-align:center; color:var(--ink-dim); font-size:14.5px; line-height:1.55}
  .foot{text-align:center; font-size:12.5px; font-style:italic; color:var(--ink-dim); padding:18px 22px 20px; line-height:1.5}

  /* ---- Game screen ---- */
  .g-head{padding:16px 16px 4px}
  .g-head:empty{display:none}
  .g-round{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-dim); margin-bottom:14px}
  .g-name{font-size:19px; line-height:1.18; overflow-wrap:anywhere; text-wrap:balance}
  .g-score{font-size:42px; line-height:1}
  .bug.big{gap:10px}
  .bug.big .mid{gap:10px}
  .bug.big .dash{font-size:26px}
  .bug.big .at{font-size:16px}
  .g-name.loser, .g-score.loser{color:var(--ink-dim)}
  .g-status{display:flex; align-items:center; justify-content:center; gap:4px 10px; flex-wrap:wrap; margin-top:14px}
  .g-detail{font-size:12.5px; font-style:italic; color:var(--ink-dim)}
  .g-series{font-size:13.5px; color:var(--ink-soft); margin-top:6px}
  .g-body{padding:4px 14px 0}
  .sec{font-size:13px; color:var(--ink-dim); margin:20px 2px 8px}
  .note{font-size:13px; font-style:italic; color:var(--ink-dim); line-height:1.5; margin:12px 2px 0}
  .live-note{font-size:12.5px; font-style:italic; color:var(--ink-dim); margin:12px 2px 0}
  .plays{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .play{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px 11px}
  .play.scoring{border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
  .play-top{display:flex; justify-content:center; gap:10px; font-size:12.5px; font-style:italic; color:var(--ink-dim)}
  .play-tag{font-style:normal; color:var(--ink-soft)}
  .play-sub{font-size:12.5px; color:var(--ink-dim); margin-top:2px}
  .play-text{font-size:15px; line-height:1.45; margin-top:4px; overflow-wrap:anywhere}
  .play-score{font-size:13px; color:var(--accent); margin-top:5px}
  @media (prefers-reduced-motion:no-preference){ .play.enter{animation:slidein .5s ease-out} }
  @keyframes slidein{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}
  .tbl-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-top:12px}
  .tbl{border-collapse:collapse; width:100%; font-size:13.5px; color:var(--ink-soft)}
  .tbl th, .tbl td{padding:8px 9px; text-align:center; white-space:nowrap; border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl th{font-size:12px; color:var(--ink-dim)}
  .tbl .pcol{position:sticky; left:0; background:var(--surface); color:var(--ink)}
  .tbl th.pcol{color:var(--ink-dim)}
  .tbl .pcol i{font-size:11.5px; color:var(--ink-dim); margin-left:4px}
  .tbl .tot{color:var(--ink)}
  .tbl th.tot{color:var(--ink-soft)}
  .tbl .dnp{font-style:italic; color:var(--ink-dim)}
  .tbl.line .tot{font-size:15px}
  .cmp{display:grid; grid-template-columns:1fr 1.6fr 1fr; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px}
  .cmp:last-child{border-bottom:0}
  .cmp span{color:var(--ink-dim); font-size:13px}
  .cmp-head b{font-size:12px; color:var(--ink-dim)}
  .pl{display:grid; grid-template-columns:58px 1fr 58px; align-items:baseline; gap:6px; padding:9px 0; border-bottom:1px solid var(--line)}
  .pl:last-child{border-bottom:0}
  .num{font-size:13px; color:var(--ink-dim)}
  .pname{font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ppos{font-size:12.5px; font-style:italic; color:var(--ink-dim)}

  /* ---- Cards, forms, buttons ---- */
  .profile{padding:20px 16px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 16px}
  .card.cmp-card{padding:6px 14px}
  .card.roster{padding:4px 14px}
  .sec + .tbl-wrap, .sec + .card{margin-top:0}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:16px}
  .seg.side{margin:12px 0 0}
  .seg button{border:0; background:transparent; border-radius:9px; padding:8px 0; cursor:pointer; font-size:14.5px; color:var(--ink-dim)}
  .seg button[aria-pressed="true"]{background:var(--surface-raised); color:var(--ink); box-shadow:0 0 0 1px var(--line-strong)}
  .field{display:block; margin-bottom:12px}
  .field span{display:block; font-size:13px; color:var(--ink-dim); margin-bottom:5px}
  .field input{width:100%; text-align:center; font-size:16px; color:var(--ink); background:var(--field); border:1px solid var(--line-strong); border-radius:10px; padding:10px 12px 11px}
  .field input:focus{outline:2px solid var(--accent); outline-offset:0; border-color:transparent}
  .hint{font-size:13px; font-style:italic; color:var(--ink-dim); line-height:1.45; margin:-4px 0 12px}
  .error{font-size:14px; color:var(--danger); line-height:1.4; margin:0 0 12px}
  .info{font-size:14px; color:var(--accent); line-height:1.4; margin:0 0 12px}
  .btn{display:block; width:100%; border:0; border-radius:12px; padding:12px 13px 13px; cursor:pointer; font-size:16px; background:var(--accent); color:var(--accent-ink)}
  .btn[disabled]{opacity:.5; cursor:default}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong)}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 45%, var(--line))}
  .btn + .btn{margin-top:10px}
  .more{margin-top:12px}
  #retryAccounts{margin-top:12px}
  .link-btn{display:block; margin:12px auto 0; border:0; background:transparent; cursor:pointer; font-size:14px; font-style:italic; color:var(--ink-dim); text-decoration:underline; padding:4px 8px}
  .device-note{font-size:13px; font-style:italic; color:var(--ink-dim); line-height:1.5; margin:14px 2px 0; text-align:center}
  .who{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px; min-width:0}
  .avatar{flex:0 0 auto; width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:28px; line-height:1}
  .who-name{font-size:24px; line-height:1.15; overflow-wrap:anywhere}
  .who-email{font-size:13.5px; color:var(--ink-dim); overflow-wrap:anywhere}
  .who-since{font-size:12.5px; font-style:italic; color:var(--ink-dim); margin-top:2px}

  /* ---- Bottom bar ---- */
  .nav{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:10;
    width:100%; max-width:480px; display:grid; grid-template-columns:1fr 1fr;
    background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .nav button{
    height:var(--nav-h); border:0; background:transparent; cursor:pointer; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12.5px;
  }
  .nav button[aria-current="page"]{color:var(--accent)}
  #navProfileLabel{max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* ---- Tap feedback ---- */
  button, .radio-btn, .game{position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent}
  .back{position:absolute}
  .ink{position:absolute; border-radius:50%; pointer-events:none; background:color-mix(in srgb, var(--accent) 26%, transparent); transform:scale(0); opacity:1}
  @media (prefers-reduced-motion:no-preference){
    button, .radio-btn, .game{transition:transform .14s ease, background-color .18s ease, color .18s ease, border-color .18s ease}
    button:active, .radio-btn:active{transform:scale(.95)}
    .game:has(.game-link:active){transform:scale(.98)}
    .ink{animation:ink .55s ease-out forwards}
    .pop{animation:pop .28s ease-out}
    .swap{animation:swap .22s ease-out}
    main.enter{animation:enter .26s ease-out}
  }
  @keyframes ink{to{transform:scale(1); opacity:0}}
  @keyframes pop{0%{transform:scale(.9)} 60%{transform:scale(1.05)} 100%{transform:scale(1)}}
  @keyframes swap{from{opacity:0} to{opacity:1}}
  @keyframes enter{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
</style>
</head>

  var saved = store.get("slate.league");
  var league = LEAGUES[saved] ? saved : "cfb";
  var filter = "all";
  var view = "home";

  function timeStr(d, withSeconds){
    var o = {hour:"numeric", minute:"2-digit"};
    if (withSeconds) o.second = "2-digit";
    return d.toLocaleTimeString(undefined, o);
  }

  var listHtml = null;
  function setList(html){
    if (html === listHtml) return;
    listHtml = html;
    $("games").innerHTML = html;
  }
  function paint(){
    var lg = LEAGUES[league], d = data[league];
    var gamesEl = $("games"), banner = $("banner"), pulse = $("pulse");

    // The Radio filter only means something for college football.
    var radioChip = document.querySelector('#filters [data-f="radio"]');
    radioChip.hidden = !lg.college;
    if (!lg.college && filter === "radio") filter = "all";
    Array.prototype.forEach.call(document.querySelectorAll("#filters button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.f === filter));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#leagues button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.league === league));
    });

    $("foot").textContent = "Scores come straight from ESPN. Live games refresh every 10 seconds while this page is open." +
      (lg.college ? " Radio buttons appear where a current source confirmed a team's station or listen page. A station's web stream doesn't always carry the game." : "");

    // Status light
    pulse.classList.toggle("stale", !!d.error);
    pulse.classList.toggle("idle", !d.error && !d.loaded);
    $("pulseText").textContent = d.error ? "Not updating" : (d.loaded ? "Updated " + timeStr(d.lastOk, true) : "Connecting");

    // Problem banner
    banner.hidden = !d.error;
    if (d.error){
      banner.textContent = d.loaded
        ? "Couldn't reach ESPN just now. These are the " + lg.label + " scores from " + timeStr(d.lastOk) + ". Trying again shortly."
        : "This page couldn't get " + lg.label + " scores from ESPN (" + d.error + "). Check your internet connection. If that's fine, your browser or network is blocking the request. Trying again shortly.";
    }

    if (!d.loaded){
      $("sub").textContent = d.error ? "No scores yet" : "Loading " + lg.label + " games";
      setList(d.error ? "" : '<div class="empty">Loading ' + esc(lg.label) + ' games…</div>');
      return;
    }

    var games = allGames(league);
    var live = games.filter(function(g){ return g.state === "live"; }).length;
    var parts = [games.length + (games.length === 1 ? " game" : " games"), live + " live"];
    if (lg.college) parts.push(games.filter(gameHasRadio).length + " with radio");
    $("sub").textContent = parts.join(", ");

    var shown = games.filter(function(g){
      if (filter === "live") return g.state === "live";
      if (filter === "radio") return gameHasRadio(g);
      if (filter === "upcoming") return g.state === "upcoming";
      if (filter === "final") return g.state === "final";
      return true;
    });
    if (!shown.length){
      setList('<div class="empty">' + (games.length
        ? "No " + esc(lg.label) + " games match this filter right now."
        : "ESPN isn't listing any " + esc(lg.name) + " games right now.") + '</div>');
      return;
    }

    var html = "";
    var liveGames = shown.filter(function(g){ return g.state === "live"; });
    if (liveGames.length){
      html += '<div class="group-head live mono">Live now</div><div class="list">' + liveGames.map(gameHtml).join("") + '</div>';
    }
    var rest = shown.filter(function(g){ return g.state !== "live"; })
      .sort(function(a, b){ return new Date(a.start) - new Date(b.start); });
    var groups = {};
    rest.forEach(function(g){
      var off = dayOffset(g.start);
      (groups[off] || (groups[off] = [])).push(g);
    });
    // Today first, then the days ahead in order, then earlier days (most recent first).
    Object.keys(groups).map(Number).sort(function(a, b){
      if ((a < 0) !== (b < 0)) return a < 0 ? 1 : -1;
      return a < 0 ? b - a : a - b;
    }).forEach(function(off){
      html += '<div class="group-head mono">' + esc(dayLabel(groups[off][0].start, off)) + '</div><div class="list">' + groups[off].map(gameHtml).join("") + '</div>';
    });
    setList(html);
  }

  function getJson(url){
    return fetch(url, {cache:"no-store"}).then(function(res){
      if (!res.ok) throw new Error("ESPN answered with error " + res.status);
      return res.json();
    });
  }

  function load(k){
    var lg = LEAGUES[k], d = data[k];
    if (d.loading) return;
    d.loading = true;
    d.lastTry = Date.now();
    var base = API + lg.path + "/scoreboard";
    getJson(base + lg.query)
      .then(function(json){
        // If the all-games request comes back empty, fall back to ESPN's default list.
        if (lg.query && (!json.events || !json.events.length)) return getJson(base);
        return json;
      })
      .then(function(json){
        d.games = (json.events || []).map(function(e){ return normalize(e, lg, k); });
        d.loaded = true; d.lastOk = new Date(); d.error = null;
      })
      .catch(function(err){
        d.error = (err && err.message) ? err.message : "request blocked";
      })
      .then(function(){
        d.loading = false;
        // A late answer for another league, or one that lands after you've opened a game, only updates its saved slot.
        if (k === league && view === "home") paint();
      });
    loadSchedule(k);
  }

  // League switcher
  $("leagues").innerHTML = LEAGUE_ORDER.map(function(k){
    return '<button type="button" data-league="' + k + '" aria-pressed="false">' + LEAGUES[k].label + '</button>';
  }).join("");
  $("leagues").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-league]");
    if (!btn || btn.dataset.league === league) return;
    league = btn.dataset.league;
    store.set("slate.league", league);
    window.scrollTo(0, 0);
    paint();
    load(league);
  });
  $("filters").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-f]");
    if (!btn) return;
    filter = btn.dataset.f;
    paint();
  });

  // Refresh on a timer, but only the league on screen and not in a background tab.
  // One clock for both screens. Every second it asks "is a check due?", so
  // the pace can change the moment a game goes live or ends. A check never
  // starts while the previous one is still on its way, so a slow connection
  // can't pile requests up. Nothing runs while the tab is in the background.
  setInterval(function(){
    if (document.hidden) return;
    var now = Date.now();
    if (view === "home"){
      var d = data[league];
      var anyLive = allGames(league).some(function(g){ return g.state === "live"; });
      if (now - (d.lastTry || 0) >= (anyLive ? HOME_LIVE_MS : HOME_IDLE_MS)) load(league);
    } else if (view === "game" && game){
      if (game.state === "final" && game.loaded) return;     // a finished game doesn't change
      var every = (game.state === "upcoming" && game.loaded) ? GAME_IDLE_MS : GAME_LIVE_MS;
      if (now - (game.lastTry || 0) >= every) loadGame();
    }
  }, 1000);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) return;
    if (view === "home") load(league);
    else if (view === "game" && game && !(game.state === "final" && game.loaded)) loadGame();
  });

  // =========================================================================
  // Game screen (Lineups / Box score / Plays)
  // =========================================================================
  // Everything here reads ESPN's "summary" for one game. ESPN leaves sections
  // out when it has nothing (no plays before kickoff, no lineups for
  // football), so every piece checks before it reads and shows a plain
  // "not posted" message instead of breaking.
  var PLAYS_SHOWN = 60;
  var game = null;      // the game on screen
  var rosters = {};     // team rosters fetched for the Lineups tab, kept for the session

  function same(a, b){ return a != null && b != null && String(a) === String(b); }
  function cap(s){ s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }
  function empty(msg){ return '<div class="empty">' + esc(msg) + '</div>'; }

  function openGame(k, id){
    var base = allGames(k).filter(function(g){ return same(g.id, id); })[0] || null;
    game = {league:k, id:id, base:base, sum:null, loaded:false, error:null, loading:false, lastOk:null,
            tab:null, side:"away", seen:null, showAll:false, state:base ? base.state : null, drawn:{}};
    paintGame();
    loadGame();
  }

  function loadGame(){
    var g = game;
    if (!g || g.loading) return;
    g.loading = true;
    g.lastTry = Date.now();
    getJson(API + LEAGUES[g.league].path + "/summary?event=" + encodeURIComponent(g.id))
      .then(function(json){ g.sum = json; g.loaded = true; g.lastOk = new Date(); g.error = null; })
      .catch(function(err){ g.error = (err && err.message) ? err.message : "request blocked"; })
      .then(function(){
        g.loading = false;
        if (game === g && view === "game") paintGame();
      });
  }

  // The summary carries its own copy of the scoreboard entry; reading it
  // through the same function as the home screen keeps the two in step.
  function infoFromSummary(sum, lg, k){
    var h = sum && sum.header, comp = h && arr(h.competitions)[0];
    if (!comp || !arr(comp.competitors).length) return null;
    var info = normalize({id:h.id, date:comp.date, season:h.season, competitions:[comp], status:comp.status}, lg, k);
    if (!info.post.note && h.gameNote) info.post.note = h.gameNote;
    return info;
  }

  // ---- Plays ----
  function periodLabel(n, lg){
    n = Number(n) || 0;
    if (lg.sport === "football" || lg.sport === "basketball"){
      if (n <= 4) return "Q" + n;
      return n === 5 ? "OT" : (n - 4) + "OT";
    }
    return String(n);
  }
  function scoreLine(p, info){
    if (p.awayScore == null || p.homeScore == null) return "";
    return info.away.abbr + " " + p.awayScore + ", " + info.home.abbr + " " + p.homeScore;
  }
  // Returns plays oldest first: {id, when, tag, sub, text, scoring, score}
  function extractPlays(sum, lg, info){
    var out = [], seen = {};
    function push(p, when, tag, sub){
      if (!p || !p.text) return;
      var id = String(p.id || p.sequenceNumber || (when + "|" + p.text));
      if (seen[id]) return;
      seen[id] = 1;
      out.push({id:id, when:when, tag:tag || "", sub:sub || "", text:p.text,
                scoring:!!p.scoringPlay, score:p.scoringPlay ? scoreLine(p, info) : ""});
    }
    function clock(p){ return (p.clock && p.clock.displayValue) || ""; }
    function abbrOf(teamId){
      return same(teamId, info.away.id) ? info.away.abbr : (same(teamId, info.home.id) ? info.home.abbr : "");
    }

    if (lg.sport === "football"){
      var d = sum.drives || {};
      var drives = arr(d.previous).concat(d.current ? [d.current] : []);
      drives.forEach(function(dr){
        var tag = (dr.team && (dr.team.abbreviation || abbrOf(dr.team.id))) || "";
        arr(dr.plays).forEach(function(p){
          var when = (periodLabel(p.period && p.period.number, lg) + " " + clock(p)).trim();
          var st = p.start || {};
          push(p, when, tag, st.downDistanceText || st.shortDownDistanceText || "");
        });
      });
      // Some football games only come with the scoring plays.
      if (!out.length) arr(sum.scoringPlays).forEach(function(p){
        var when = (periodLabel(p.period && p.period.number, lg) + " " + clock(p)).trim();
        p = Object.assign({}, p, {scoringPlay:true});
        push(p, when, (p.team && (p.team.abbreviation || abbrOf(p.team.id))) || "", (p.type && p.type.text) || "");
      });
    } else if (lg.sport === "basketball"){
      arr(sum.plays).forEach(function(p){
        var when = (periodLabel(p.period && p.period.number, lg) + " " + clock(p)).trim();
        push(p, when, abbrOf(p.team && p.team.id), "");
      });
    } else {
      // Baseball lists every pitch. Keep the outcomes, drop the pitch-by-pitch.
      var all = arr(sum.plays).filter(function(p){ return p && p.text; });
      var kind = function(p){ return String((p.type && p.type.type) || "").toLowerCase(); };
      var results = all.filter(function(p){ return p.scoringPlay || kind(p) === "play-result" || /inning/.test(kind(p)); });
      if (!results.length) results = all.filter(function(p){ return !/^pitch\b/i.test(p.text) && kind(p) !== "pitch"; });
      results.forEach(function(p){
        var per = p.period || {};
        var when = ((per.type ? cap(per.type) + " " : "") + (per.displayValue || per.number || "")).trim();
        push(p, when, abbrOf(p.team && p.team.id), "");
      });
    }
    return out;
  }
  function playHtml(p, isNew){
    return '<div class="play' + (p.scoring ? ' scoring' : '') + (isNew ? ' enter' : '') + '">' +
      '<div class="play-top mono"><span>' + esc(p.when) + '</span>' + (p.tag ? '<span class="play-tag">' + esc(p.tag) + '</span>' : '') + '</div>' +
      (p.sub ? '<div class="play-sub mono">' + esc(p.sub) + '</div>' : '') +
      '<div class="play-text">' + esc(p.text) + '</div>' +
      (p.score ? '<div class="play-score mono">' + esc(p.score) + '</div>' : '') +
    '</div>';
  }
  function playsBody(g, info, lg){
    if (!g.loaded) return empty(g.error ? "" : "Loading plays…");
    var plays = extractPlays(g.sum, lg, info);
    if (!plays.length){
      return empty(info.state === "upcoming" ? "Plays will show up here once the game starts."
                                              : "ESPN hasn't posted plays for this game.");
    }
    var first = !g.seen, seen = g.seen || {};
    var newest = plays.slice().reverse();
    var list = g.showAll ? newest : newest.slice(0, PLAYS_SHOWN);
    var html = (info.state === "live" ? '<div class="live-note mono">Checks for new plays every 5 seconds</div>' : '') +
      '<div class="plays">' + list.map(function(p){ return playHtml(p, !first && !seen[p.id]); }).join("") + '</div>';
    if (!g.showAll && newest.length > PLAYS_SHOWN){
      html += '<button type="button" class="btn ghost more" data-act="allplays">Show all ' + newest.length + ' plays</button>';
    }
    g.seen = {};
    plays.forEach(function(p){ g.seen[p.id] = 1; });
    return html;
  }

  // ---- Box score ----
  function lineScoreHtml(info, lg){
    var n = Math.max(info.away.lines.length, info.home.lines.length);
    if (!n) return "";
    var base = lg.sport === "baseball";
    var head = '<th></th>';
    for (var i = 1; i <= n; i++) head += '<th>' + (base ? i : esc(periodLabel(i, lg).replace(/^Q/, ""))) + '</th>';
    head += base ? '<th class="tot">R</th><th>H</th><th>E</th>' : '<th class="tot">T</th>';
    function row(t){
      var r = '<td class="pcol">' + esc(t.abbr || t.name) + '</td>';
      for (var i = 0; i < n; i++) r += '<td>' + esc(t.lines[i] == null ? "" : t.lines[i]) + '</td>';
      r += '<td class="tot">' + (t.score === null ? "" : t.score) + '</td>';
      if (base) r += '<td>' + esc(t.hits == null ? "" : t.hits) + '</td><td>' + esc(t.errors == null ? "" : t.errors) + '</td>';
      return '<tr>' + r + '</tr>';
    }
    return '<div class="tbl-wrap"><table class="tbl line"><thead><tr>' + head + '</tr></thead><tbody>' +
      row(info.away) + row(info.home) + '</tbody></table></div>';
  }

  var BASEBALL_TEAM_STATS = {hits:1, runs:1, homeruns:1, rbis:1, walks:1, strikeouts:1, stolenbases:1, leftonbase:1, doubles:1, triples:1};
  function flatTeamStats(t){
    var out = [];
    arr(t && t.statistics).forEach(function(s){
      if (!s) return;
      if (Array.isArray(s.stats)){
        // Baseball nests its team numbers in groups; take the familiar batting ones.
        if (String(s.name).toLowerCase() !== "batting") return;
        s.stats.forEach(function(x){
          if (x && BASEBALL_TEAM_STATS[String(x.name).toLowerCase()] && x.displayValue != null){
            out.push({name:x.name, label:x.displayName || x.abbreviation || x.name, value:x.displayValue});
          }
        });
      } else if (s.displayValue != null){
        out.push({name:s.name, label:s.label || s.abbreviation || s.name, value:s.displayValue});
      }
    });
    return out;
  }
  function boxTeam(sum, info, side){
    var teams = arr(sum.boxscore && sum.boxscore.teams);
    return teams.filter(function(t){ return t && (t.homeAway === side || same(t.team && t.team.id, info[side].id)); })[0] || null;
  }
  function teamStatsHtml(sum, info){
    var a = flatTeamStats(boxTeam(sum, info, "away")), h = flatTeamStats(boxTeam(sum, info, "home"));
    if (!a.length || !h.length) return "";
    var byName = {};
    h.forEach(function(s){ byName[s.name] = s.value; });
    var rows = a.filter(function(s){ return byName[s.name] != null; }).slice(0, 14).map(function(s){
      return '<div class="cmp"><b>' + esc(s.value) + '</b><span>' + esc(s.label) + '</span><b>' + esc(byName[s.name]) + '</b></div>';
    }).join("");
    if (!rows) return "";
    return '<h3 class="sec mono">Team stats</h3><div class="card cmp-card">' +
      '<div class="cmp cmp-head mono"><b>' + esc(info.away.abbr) + '</b><span></span><b>' + esc(info.home.abbr) + '</b></div>' + rows + '</div>';
  }
  function playersEntry(sum, t){
    var b = sum.boxscore || {};
    return arr(b.players).filter(function(p){ return p && same(p.team && p.team.id, t.id); })[0] || null;
  }
  function playerTablesHtml(sum, t){
    var entry = playersEntry(sum, t);
    if (!entry) return "";
    return arr(entry.statistics).map(function(grp){
      var labels = arr(grp.labels).length ? grp.labels : arr(grp.names);
      var rows = arr(grp.athletes).filter(function(a){ return a && a.athlete; });
      if (!rows.length || !labels.length) return "";
      var title = grp.text || cap(grp.name || grp.type || "Players");
      var head = '<th class="pcol">Player</th>' + labels.map(function(l){ return '<th>' + esc(l) + '</th>'; }).join("");
      var body = rows.map(function(a){
        var ath = a.athlete, pos = (ath.position && ath.position.abbreviation) || (a.position && a.position.abbreviation) || "";
        var who = '<td class="pcol">' + esc(ath.shortName || ath.displayName || "") + (pos ? ' <i>' + esc(pos) + '</i>' : '') + '</td>';
        if (a.didNotPlay || !arr(a.stats).length){
          return '<tr>' + who + '<td class="dnp" colspan="' + labels.length + '">' + esc(a.reason || "Did not play") + '</td></tr>';
        }
        return '<tr>' + who + labels.map(function(_, i){ return '<td>' + esc(a.stats[i] == null ? "" : a.stats[i]) + '</td>'; }).join("") + '</tr>';
      }).join("");
      return '<h3 class="sec mono">' + esc(title) + '</h3><div class="tbl-wrap"><table class="tbl"><thead><tr>' + head +
             '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }).join("");
  }
  function sideToggle(g, info){
    function b(side){
      return '<button type="button" data-side="' + side + '" aria-pressed="' + (g.side === side) + '">' + esc(info[side].short) + '</button>';
    }
    return '<div class="seg side" data-act="side">' + b("away") + b("home") + '</div>';
  }
  function boxBody(g, info, lg){
    if (!g.loaded) return empty(g.error ? "" : "Loading box score…");
    var line = lineScoreHtml(info, lg), team = teamStatsHtml(g.sum, info);
    var players = playerTablesHtml(g.sum, info[g.side]);
    var hasPlayers = !!(playersEntry(g.sum, info.away) || playersEntry(g.sum, info.home));
    if (!line && !team && !hasPlayers){
      return empty(info.state === "upcoming" ? "The box score fills in once the game starts."
                                              : "ESPN hasn't posted a box score for this game.");
    }
    return line + team + (hasPlayers
      ? '<h3 class="sec mono">Player stats</h3>' + sideToggle(g, info) + (players || empty("No player stats for this team yet."))
      : "");
  }

  // ---- Lineups ----
  function person(num, name, pos, extra){ return {num:num, name:name, pos:pos || "", extra:extra || ""}; }
  function posOf(x){ return (x && x.position && x.position.abbreviation) || ""; }

  // Starting lineup from the game itself, where ESPN publishes one. Returns
  // null when it doesn't, and the caller falls back to the team roster.
  function lineupFromSummary(sum, t, side, lg){
    if (!sum) return null;
    if (lg.sport === "basketball"){
      var entry = playersEntry(sum, t), grp = entry && arr(entry.statistics)[0];
      var list = arr(grp && grp.athletes).filter(function(a){ return a && a.athlete; });
      var starters = list.filter(function(a){ return a.starter; });
      if (!starters.length) return null;
      var mk = function(a){ return person(a.athlete.jersey, a.athlete.displayName, posOf(a.athlete)); };
      return [{title:"Starters", players:starters.map(mk)},
              {title:"Bench", players:list.filter(function(a){ return !a.starter; }).map(mk)}];
    }
    if (lg.sport === "baseball"){
      var r = arr(sum.rosters).filter(function(x){ return x && (x.homeAway === side || same(x.team && x.team.id, t.id)); })[0];
      var people = arr(r && r.roster).filter(function(x){ return x && x.athlete; });
      if (!people.length){
        // Older games only carry the lineup inside the batting table.
        var e = playersEntry(sum, t);
        arr(e && e.statistics).forEach(function(grp){
          if (String(grp.type || grp.name).toLowerCase() !== "batting") return;
          people = arr(grp.athletes).filter(function(a){ return a && a.athlete; });
        });
      }
      var order = people.filter(function(x){ return x.starter && Number(x.batOrder) > 0; })
        .sort(function(a, b){ return Number(a.batOrder) - Number(b.batOrder); });
      if (!order.length) return null;
      var p = function(x){ return (x.position && x.position.abbreviation) || (arr(x.positions)[0] || {}).abbreviation || posOf(x.athlete); };
      var groups = [{title:"Batting order", players:order.map(function(x){ return person(x.batOrder, x.athlete.displayName, p(x)); })}];
      var sp = people.filter(function(x){ return x.starter && !(Number(x.batOrder) > 0); });
      if (sp.length) groups.push({title:"Starting pitcher", players:sp.map(function(x){ return person(x.athlete.jersey, x.athlete.displayName, p(x)); })});
      var rest = people.filter(function(x){ return !x.starter; });
      if (rest.length) groups.push({title:"Bench and bullpen", players:rest.map(function(x){ return person(x.athlete.jersey, x.athlete.displayName, p(x)); })});
      return groups;
    }
    return null;   // football: ESPN doesn't publish starters
  }

  var GROUP_NAMES = {offense:"Offense", defense:"Defense", specialteam:"Special teams", specialteams:"Special teams",
                     injuredreserveorout:"Injured or out", practicesquad:"Practice squad",
                     g:"Guards", f:"Forwards", c:"Centers"};
  function rosterFor(k, teamId){
    var id = k + "/" + teamId;
    if (rosters[id]) return rosters[id];
    var slot = rosters[id] = {state:"loading", groups:[]};
    var lg = LEAGUES[k];
    getJson(API + lg.path + "/teams/" + encodeURIComponent(teamId) + "/roster")
      .then(function(json){
        var mk = function(a){
          return person(a.jersey, a.displayName || a.fullName || "", posOf(a), lg.college && a.experience ? (a.experience.abbreviation || a.experience.displayValue || "") : "");
        };
        var list = arr(json.athletes), groups;
        if (list.length && Array.isArray(list[0].items)){
          groups = list.map(function(grp){
            var name = String(grp.position || "");
            return {title: GROUP_NAMES[name.toLowerCase()] || cap(name) || "Roster", players: arr(grp.items).map(mk)};
          });
        } else {
          groups = [{title:"Roster", players:list.map(mk)}];
        }
        slot.groups = groups.filter(function(grp){ return grp.players.length; });
        slot.state = slot.groups.length ? "ready" : "failed";
      })
      .catch(function(){ slot.state = "failed"; })
      .then(function(){ if (view === "game" && game && game.tab === "lineups") paintGame(); });
    return slot;
  }
  function groupsHtml(groups){
    return groups.map(function(grp){
      return '<h3 class="sec mono">' + esc(grp.title) + '</h3><div class="card roster">' + grp.players.map(function(p){
        return '<div class="pl"><span class="num mono">' + esc(p.num == null ? "" : p.num) + '</span><span class="pname">' + esc(p.name) +
               '</span><span class="ppos mono">' + esc([p.pos, p.extra].filter(Boolean).join(", ")) + '</span></div>';
      }).join("") + '</div>';
    }).join("");
  }
  function lineupBody(g, info, lg){
    var t = info[g.side], html = sideToggle(g, info);
    var groups = lineupFromSummary(g.sum, t, g.side, lg);
    if (groups) return html + groupsHtml(groups);
    if (!t.id) return html + empty("ESPN hasn't posted a lineup for this team.");
    var r = rosterFor(g.league, t.id);
    if (r.state === "loading") return html + empty("Loading roster…");
    if (r.state === "failed") return html + empty("ESPN hasn't posted a lineup or roster for this team.");
    var why = lg.sport === "football"
      ? "Football feeds don't publish starting lineups, so this is the full roster."
      : "The starting lineup isn't posted yet. This is the full roster.";
    return html + '<p class="note">' + why + '</p>' + groupsHtml(r.groups);
  }

  // ---- Screen ----
  function setHtml(el, key, html){
    // Skip the redraw when nothing changed, so a table you've scrolled sideways stays put.
    if (game.drawn[key] === html) return;
    game.drawn[key] = html;
    el.innerHTML = html;
  }
  function paintGame(){
    var g = game;
    if (!g) return;
    var lg = LEAGUES[g.league];
    var info = (g.sum && infoFromSummary(g.sum, lg, g.league)) || g.base;
    var pulse = $("pulse");
    pulse.classList.toggle("stale", !!g.error);
    pulse.classList.toggle("idle", !g.error && !g.loaded);
    $("pulseText").textContent = g.error ? "Not updating" : (g.loaded ? "Updated " + timeStr(g.lastOk, true) : "Connecting");
    $("title").textContent = lg.label;

    var banner = $("gBanner");
    banner.hidden = !g.error;
    if (g.error){
      banner.textContent = g.loaded
        ? "Couldn't reach ESPN just now. This is what loaded at " + timeStr(g.lastOk) + ". Trying again shortly."
        : "This page couldn't get this game from ESPN (" + g.error + "). Trying again shortly.";
    }
    if (!info){
      $("gameControls").hidden = true;
      setHtml($("gHead"), "head", "");
      setHtml($("gBody"), "body", g.error ? "" : empty(g.loaded ? "ESPN doesn't have details for this game." : "Loading game…"));
      return;
    }
    g.state = info.state;
    if (!g.tab) g.tab = info.state === "live" ? "plays" : (info.state === "final" ? "box" : "lineups");

    var status;
    if (info.state === "live") status = '<span class="status live mono"><span class="dot"></span>Live</span><span class="mono g-detail">' + esc(info.detail) + '</span>';
    else if (info.state === "final") status = '<span class="status mono">' + esc(info.detail || "Final") + '</span>';
    else status = '<span class="mono g-detail">' + esc(kickoffLong(info.start)) + '</span>';
    if (info.tv && info.state !== "final") status += '<span class="mono g-detail">' + esc(info.tv) + '</span>';
    var round = info.post.post
      ? '<div class="g-round"><span class="po">' + esc(info.post.tag) + '</span>' + (info.post.note ? '<span>' + esc(info.post.note) + '</span>' : '') + '</div>'
      : (info.post.note ? '<div class="g-round"><span>' + esc(info.post.note) + '</span></div>' : '');
    setHtml($("gHead"), "head",
      round + bugHtml(info, true) +
      '<div class="g-status">' + status + '</div>' +
      (info.post.series ? '<div class="g-series">' + esc(info.post.series) + '</div>' : '') +
      '<div class="actions">' + radioHtml(info) + '</div>');

    $("gameControls").hidden = false;
    Array.prototype.forEach.call(document.querySelectorAll("#gTabs button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.tab === g.tab));
    });
    var body = g.tab === "plays" ? playsBody(g, info, lg) : (g.tab === "box" ? boxBody(g, info, lg) : lineupBody(g, info, lg));
    setHtml($("gBody"), "body", body);
  }
  function kickoffLong(iso){
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  }

  $("gTabs").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if (!btn || !game) return;
    game.tab = btn.dataset.tab;
    window.scrollTo(0, 0);
    paintGame();
  });
  $("gBody").addEventListener("click", function(e){
    if (!game) return;
    var side = e.target.closest("button[data-side]");
    if (side){ game.side = side.dataset.side; paintGame(); return; }
    if (e.target.closest('[data-act="allplays"]')){ game.showAll = true; paintGame(); }
  });



  // =========================================================================
  // Accounts (Firebase: real accounts that work on any device)
  // =========================================================================
  // This block identifies the Firebase project. It is meant to be public: it
  // is an address, not a password. Passwords never touch this page's storage;
  // Firebase keeps them.
  var FIREBASE = {
    apiKey: "AIzaSyC4K05dTJBmDF5qdRWqrwLkenjwBBOHnfA",
    authDomain: "live-slate.firebaseapp.com",
    projectId: "live-slate",
    storageBucket: "live-slate.firebasestorage.app",
    messagingSenderId: "715060689514",
    appId: "1:715060689514:web:92367d2d85774dc2aca813"
  };
  var SDK = "https://www.gstatic.com/firebasejs/12.19.0/";

  var fb = null;                 // {A: auth functions, auth, F: database functions, db}
  var me = null;                 // signed-in user, or null
  var accountsState = "loading"; // loading | ready | failed
  var pendingName = "";          // username typed at sign-up, shown until Firebase has saved it
  var signingUp = false;         // sign-up has several steps; hold the screen still until they finish

  // An earlier version kept test accounts in this browser. Clear them out.
  store.del("slate.accounts"); store.del("slate.session");

  // Firebase is loaded on its own so that scores keep working even if the
  // account service can't be reached.
  function startAccounts(){
    accountsState = "loading";
    paintProfile();
    Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore-lite.js")])
      .then(function(m){
        var app = m[0].initializeApp(FIREBASE), A = m[1], F = m[2];
        fb = {A: A, auth: A.getAuth(app), F: F, db: F.getFirestore(app)};
        A.onAuthStateChanged(fb.auth, function(user){
          me = user;
          accountsState = "ready";
          if (signingUp) return;
          paintProfile();
          if (user) claimIfMissing(user);
        });
      })
      .catch(function(){
        accountsState = "failed";
        paintProfile();
      });
  }

  // ---- Unique usernames ----
  // Each username is reserved by a record in the database named after its
  // lowercase form, so "Conrad" and "conrad" are the same name. The database's
  // own rules refuse a second record with the same name, which is what makes
  // this hold even if two people sign up at the same moment.
  function nameRef(lower){ return fb.F.doc(fb.db, "usernames", lower); }
  function userRef(uid){ return fb.F.doc(fb.db, "users", uid); }
  function nameTaken(username){
    return fb.F.getDoc(nameRef(username.toLowerCase())).then(function(snap){ return snap.exists(); });
  }
  function claimName(user, username){
    var lower = username.toLowerCase(), batch = fb.F.writeBatch(fb.db);
    batch.set(userRef(user.uid), {username: username, usernameLower: lower, created: fb.F.serverTimestamp()});
    batch.set(nameRef(lower), {uid: user.uid, username: username, created: fb.F.serverTimestamp()});
    return batch.commit();
  }
  // Accounts made before usernames were reserved claim theirs on sign-in.
  function claimIfMissing(user){
    var name = user.displayName || "";
    if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return;
    fb.F.getDoc(userRef(user.uid))
      .then(function(snap){ if (!snap.exists()) return claimName(user, name); })
      .catch(function(){ /* taken or database not ready: leave the account as it is */ });
  }
  function coded(message, code){ var e = new Error(message); e.friendly = message + (code ? " (" + code + ")" : ""); return e; }

  function authMessage(err){
    if (err && err.friendly) return err.friendly;
    var code = (err && err.code) || "";
    var wrong = "That email or password isn't right.";
    var off = "Email sign-in isn't switched on in the Firebase project yet.";
    var map = {
      "auth/email-already-in-use": "There's already an account with that email. Try signing in instead.",
      "auth/invalid-email": "That email address doesn't look right.",
      "auth/weak-password": "Pick a longer password.",
      "auth/missing-password": "Enter your password.",
      "auth/invalid-credential": wrong, "auth/wrong-password": wrong, "auth/user-not-found": wrong,
      "auth/user-disabled": "This account has been turned off.",
      "auth/too-many-requests": "Too many tries. Wait a few minutes and try again.",
      "auth/network-request-failed": "Couldn't reach the account service. Check your connection.",
      "auth/operation-not-allowed": off, "auth/configuration-not-found": off,
      "auth/requires-recent-login": "For safety, sign out, sign back in, then delete the account."
    };
    return map[code] || ("Something went wrong" + (code ? " (" + code + ")" : "") + ". Try again.");
  }

  var mode = "signin";
  function setMode(m){
    mode = m;
    Array.prototype.forEach.call(document.querySelectorAll("#authMode button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.mode === m));
    });
    var up = m === "signup";
    $("userWrap").hidden = !up;
    $("confirmWrap").hidden = !up;
    $("rules").hidden = !up;
    $("forgot").hidden = up;
    $("fPass").setAttribute("autocomplete", up ? "new-password" : "current-password");
    $("authSubmit").textContent = up ? "Create account" : "Sign in";
    showError(""); showInfo("");
  }
  function showError(msg){ $("authError").textContent = msg; $("authError").hidden = !msg; if (msg) showInfo(""); }
  function showInfo(msg){ $("authInfo").textContent = msg; $("authInfo").hidden = !msg; }

  function displayName(user){
    return user.displayName || pendingName || String(user.email || "").split("@")[0] || "Fan";
  }

  function paintProfile(){
    $("authBox").hidden = !!me;
    $("meBox").hidden = !me;
    $("navProfileLabel").textContent = me ? displayName(me) : "Profile";
    if (me){
      var name = displayName(me);
      $("meAvatar").textContent = name.charAt(0).toUpperCase();
      $("meName").textContent = name;
      $("meEmail").textContent = me.email || "";
      var d = new Date(me.metadata && me.metadata.creationTime);
      $("meSince").textContent = isNaN(d) ? "" : "Member since " + d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
      $("meError").hidden = true;
      resetDelete();
      return;
    }
    var ready = accountsState === "ready";
    $("authSubmit").disabled = !ready;
    $("forgot").disabled = !ready;
    $("retryAccounts").hidden = accountsState !== "failed";
    $("deviceNote").textContent =
      accountsState === "loading" ? "Connecting to the account service…" :
      accountsState === "failed"  ? "Couldn't reach the account service, so signing in is off for now. Scores still work. Check your connection and try again." :
      "Your account works on any phone or computer.";
  }

  $("authMode").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-mode]");
    if (btn) setMode(btn.dataset.mode);
  });
  // Browsers remember a failed download of the account code for as long as
  // the page stays open, so trying again means loading the page fresh.
  $("retryAccounts").addEventListener("click", function(){ location.reload(); });

  var busy = false;
  function run(btn, work){
    if (busy || !fb) return;
    busy = true;
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "One moment…";
    return work()
      .catch(function(err){ showError(authMessage(err)); })
      .then(function(){ busy = false; btn.disabled = false; btn.textContent = label; });
  }

  $("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    var username = $("fUser").value.trim(), email = $("fEmail").value.trim(), password = $("fPass").value;
    if (mode === "signup"){
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return showError("Usernames are 3 to 20 letters, numbers or underscores.");
      if (!email) return showError("Enter your email address.");
      if (password.length < 8) return showError("Passwords need at least 8 characters.");
      if (password !== $("fPass2").value) return showError("Those two passwords don't match.");
    } else if (!email || !password){
      return showError("Enter your email and password.");
    }
    showError(""); showInfo("");
    run($("authSubmit"), function(){
      if (mode === "signup"){
        pendingName = username;
        signingUp = true;
        return nameTaken(username)
          .catch(function(err){ throw coded("Couldn't check that username right now. Try again.", err && err.code); })
          .then(function(taken){
            if (taken) throw coded("That username is taken. Try another.");
            return fb.A.createUserWithEmailAndPassword(fb.auth, email, password);
          })
          .then(function(cred){
            return claimName(cred.user, username)
              .catch(function(err){
                // Someone got the name first, or the database refused. Undo the half-made account.
                var taken = err && err.code === "permission-denied";
                return fb.A.deleteUser(cred.user).catch(function(){}).then(function(){
                  throw taken ? coded("That username was just taken. Try another.")
                              : coded("Couldn't save that username. Try again.", err && err.code);
                });
              })
              .then(function(){ return fb.A.updateProfile(cred.user, {displayName: username}); });
          })
          .then(function(){ $("authForm").reset(); })
          .then(done, function(err){ done(); throw err; });
        function done(){ signingUp = false; pendingName = ""; me = fb.auth.currentUser; paintProfile(); }
      }
      return fb.A.signInWithEmailAndPassword(fb.auth, email, password)
        .then(function(){ $("authForm").reset(); });
    });
  });

  $("forgot").addEventListener("click", function(){
    var email = $("fEmail").value.trim();
    if (!email) return showError("Type your email above first, then tap Forgot password.");
    showError(""); showInfo("");
    run($("forgot"), function(){
      return fb.A.sendPasswordResetEmail(fb.auth, email).then(function(){
        showInfo("If there's an account for " + email + ", a reset link is on its way. Check your spam folder too.");
      });
    });
  });

  $("signOut").addEventListener("click", function(){
    if (!fb) return;
    fb.A.signOut(fb.auth).then(function(){ setMode("signin"); });
  });
  // Deleting takes two taps so one stray tap can't wipe the account.
  var deleteArmed = false;
  function resetDelete(){ deleteArmed = false; $("deleteAcct").textContent = "Delete account"; }
  $("deleteAcct").addEventListener("click", function(){
    if (!fb || !me) return;
    if (!deleteArmed){
      deleteArmed = true;
      this.textContent = "Tap again to delete for good";
      return;
    }
    var user = me, held = null;
    fb.F.getDoc(userRef(user.uid))
      .then(function(snap){
        if (!snap.exists()) return;
        held = snap.data();
        var batch = fb.F.writeBatch(fb.db);
        batch.delete(nameRef(held.usernameLower));
        batch.delete(userRef(user.uid));
        return batch.commit();
      })
      .then(function(){ return fb.A.deleteUser(user); })
      .then(function(){ setMode("signin"); })
      .catch(function(err){
        // The account is still there, so give it its name back.
        var restore = held ? claimName(user, held.username).catch(function(){}) : Promise.resolve();
        restore.then(function(){
          resetDelete();
          $("meError").textContent = authMessage(err);
          $("meError").hidden = false;
        });
      });
  });

  // =========================================================================
  // Bottom bar
  // =========================================================================
  // The address after the # decides the screen, so the phone's back button
  // and the browser's back arrow both work: "" is Home, "#profile" is
  // Profile, "#game/nfl/401..." is one game.
  var homeScroll = 0, hops = 0;
  function setView(v){
    if (view === "home" && v !== "home") homeScroll = window.scrollY;
    if (v !== view) replay($(v === "home" ? "viewHome" : v === "game" ? "viewGame" : "viewProfile"), "enter");
    view = v;
    $("viewHome").hidden = v !== "home";
    $("viewGame").hidden = v !== "game";
    $("viewProfile").hidden = v !== "profile";
    $("homeControls").hidden = v !== "home";
    $("gameControls").hidden = true;          // the game screen turns its tabs on once it has a game
    $("gBack").hidden = v !== "game";
    $("pulse").hidden = v === "profile";
    $("title").textContent = v === "profile" ? "Profile" : "rad sports";
    $("brandMark").hidden = v !== "home";
    var onProfile = v === "profile";
    if (onProfile){ $("navProfile").setAttribute("aria-current", "page"); $("navHome").removeAttribute("aria-current"); }
    else { $("navHome").setAttribute("aria-current", "page"); $("navProfile").removeAttribute("aria-current"); }
  }
  function route(){
    var h = location.hash.replace(/^#/, "");
    var m = /^game\/([a-z]+)\/([^\/]+)$/.exec(h);
    if (m && LEAGUES[m[1]]){
      var id = decodeURIComponent(m[2]);
      setView("game");
      window.scrollTo(0, 0);
      if (game && game.league === m[1] && same(game.id, id)){ game.drawn = {}; paintGame(); loadGame(); }
      else openGame(m[1], id);
    } else if (h === "profile"){
      setView("profile");
      window.scrollTo(0, 0);
      paintProfile();
    } else {
      var back = view !== "home";
      setView("home");
      paint();
      load(league);
      if (back) window.scrollTo(0, homeScroll);   // return to the game you tapped, not the top
    }
  }
  window.addEventListener("hashchange", function(){ hops++; route(); });

  // ---- Tap feedback ----
  // Three small things, all of them answers to a tap: the control you
  // pressed gives a little, a soft green ring spreads from your finger, and
  // the screen you asked for eases in. People who have asked their device
  // for less motion get none of it.
  var calm = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  function replay(el, cls){
    if (calm || !el) return;
    el.classList.remove(cls);
    void el.offsetWidth;          // lets the same animation run again
    el.classList.add(cls);
  }
  document.addEventListener("touchstart", function(){}, {passive:true});   // lets :active styles work on iPhones
  document.addEventListener("pointerdown", function(e){
    if (calm || !e.target.closest) return;
    var hit = e.target.closest(".game-link, button, .radio-btn");
    if (!hit || hit.disabled) return;
    var host = hit.classList.contains("game-link") ? hit.parentNode : hit;
    var r = host.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2.2;
    var ink = document.createElement("span");
    ink.className = "ink";
    ink.style.width = ink.style.height = size + "px";
    ink.style.left = (e.clientX - r.left - size / 2) + "px";
    ink.style.top = (e.clientY - r.top - size / 2) + "px";
    host.appendChild(ink);
    // Removed on a timer, not on "animation finished": if the tap opens another
    // screen, this one is hidden and its animation never reports finishing.
    setTimeout(function(){ ink.remove(); }, 600);
  }, {passive:true});
  document.addEventListener("click", function(e){
    var btn = e.target.closest && e.target.closest("#leagues button, #gTabs button, #filters button, #authMode button, .nav button, .seg.side button");
    if (!btn) return;
    // the side switch is redrawn on click, so pop whichever button is pressed afterwards
    replay(btn.closest(".seg.side") ? document.querySelector('.seg.side [aria-pressed="true"]') : btn, "pop");
    if (btn.closest("#leagues, #filters")) replay($("games"), "swap");
    if (btn.closest("#gTabs, .seg.side")) replay($("gBody"), "swap");
  });
  function go(hash){
    if (location.hash.replace(/^#/, "") === hash) route(); else location.hash = hash;
  }
  $("navHome").addEventListener("click", function(){ go(""); });
  $("navProfile").addEventListener("click", function(){ go("profile"); });
  $("gBack").addEventListener("click", function(){
    if (hops > 0) history.back(); else go("");
  });

  setMode("signin");
  startAccounts();  // also fills in the username on the bottom bar once signed in
  route();
})();
</script>
</body>
